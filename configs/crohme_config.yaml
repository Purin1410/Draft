seed_everything: 7

trainer:
  checkpoint_callback: true
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: val_ExpRate
        mode: max
        filename: 'runtime_run_{epoch}-{val_ExpRate:.4f}'
  # gpus: 1
  gpus: 0,1
  accelerator: ddp #gpu
  check_val_every_n_epoch: 2
  max_epochs: 300
  deterministic: true
  resume_from_checkpoint: null
  val_check_interval: 1.0
  default_root_dir: "checkpoints"
  log_grad_norm: false

model:
  d_model: 256
  # -------- encoder --------
  growth_rate: 24
  num_layers: 16
  reduction: 0.5
  bottleneck: true
  use_dropout: true
  encoder_dropout: 0.2
  # -------- decoder --------
  nhead: 8
  num_decoder_layers: 3
  dim_feedforward: 1024
  decoder_dropout: 0.3
  dc: 32
  cross_coverage: true
  self_coverage: true
  # -------- beam search --------
  beam_size: 10
  max_len: 200
  alpha: 1.0
  early_stopping: false
  temperature: 1.0
  # -------- training --------
  optimizer:
    use: SGD # SGD, Adam, AdamW, Adadelta
    # init for SGD
    SGD:
      lr: 0.24
      momentum: 0.9
      weight_decay: 0.0001
    # init for Adam
    Adam:
      lr: 0.12
      betas: [0.9, 0.999]
    # init for AdamW
    AdamW:
      lr: 0.12
      betas: [0.9, 0.999]
      weight_decay: 1e-4
    # init for Adadelta
    Adadelta:
      lr: 1
      weight_decay: 1e-4
      eps: 1e-6

  scheduler:
    use: ReduceLROnPlateau # ReduceLROnPlateau
    interval: epoch
    monitor: val_ExpRate
    # init for ReduceLROnPlateau
    ReduceLROnPlateau:
      mode: 'max'
      factor: 0.25
      patience: 12
    warmup:
      enabled: true
      interval: "step"
      epochs: 1
      steps: 555

data:
  zipfile_path: crohme_data/data
  test_year: '2014'
  dictionary_txt: crohme_data/data/dictionary.txt
  train_batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  scale_aug: false
  cache_transforms: true

  # Augmentation params
  k_min: 0.7
  k_max: 1.4
  h_lo: 16
  h_hi: 256
  w_lo: 16
  w_hi: 1024

  # Memory control
  max_pixels_per_batch: 1280000
  pin_memory: true
  persistent_workers: true
  lazy_load: false

wandb:
  name: "runtime_run"
  project: "Baseline_HMER"
  wandb_watch: false
  wandb_watch_log: "gradients"
  wandb_watch_log_freq: 1000
  upload_artifacts: true
  artifact_cleanup_local: false
  keep_last_local_checkpoints: 1

rclone:
  enabled: true
  # Example: "purin_gdrive:" or "purin_gdrive:Baseline_HMER".
  remote_root: "purin_gdrive:Baseline_HMER"
  # Runtime default is run_name. Override only for debugging.
  run_dir: null
  resume: true
  recursive_list: true
  every_n_epochs: 1
  upload_on_train_end: true
  upload_checkpoints: true
  upload_analysis_logs: true
  command: rclone
  copy_flags: ["--update", "--verbose", "--no-traverse"]
  download_flags: ["--progress"]
  fail_on_error: false

analysis_logging:
  # Master switch for compact train analysis logs. Options: true, false.
  enabled: true
  # Directory for compact CSV/JSONL logs. Final files are grouped by run_id.
  log_dir: analysis_logs
  # Runtime override from CLI; do not hardcode final experiment names here.
  run_id: null
  # Runtime override from CLI; used in filenames only, not repeated in CSV/JSONL.
  seeds: null
  # Default target phase. Options: [train], [val], [test], or tested combinations.
  phases: [train]

  # Active compact logging features.
  csv_core: true
  jsonl_detail: true
  token_detail: true
  token_topk: 5
  teacher_forced_top1: true
  skip_sanity_check: true

  # Options for train analysis. Keep decode_autoregressive false for compact teacher-forced logs.
  train:
    enabled: true
    log_every_n_steps: 1
    max_batches_per_epoch: null
    max_samples_per_epoch: null
    decode_autoregressive: false
    log_csv_without_decode: true
    jsonl_detail: true
    topk_preds: false

  # Validation analysis is off by default. Enable only with matching schema tests.
  val:
    enabled: false
    max_samples_per_epoch: null

  # Test analysis is off by default. Enable only with matching schema tests.
  test:
    enabled: false
    max_samples_per_epoch: null

  # DDP merge behavior. Deletes rank shards only after successful atomic merge.
  merge_on_epoch_end: true
  delete_shards_after_merge: true

  # Heavy/off-by-default debug captures.
  topk_preds: false
  nbest_k: 0
  capture_embed: false
  capture_cross_attn: false
  capture_self_attn: false
  full_cross_attn_map: false
  full_self_attn_map: false
  capture_every_n_epochs: 0
  capture_max_samples_per_epoch: 64
  cross_attn:
    store: summary
    max_tokens: 64
    max_heads: 4
  self_attn:
    store: summary
    layers: all
    max_tokens: 64
    max_heads: 4
    topk_keys: 5
    include_token_labels: true

  # Off by default. Enabling currently fails fast before backward unless a safe
  # per-sample grad implementation is wired into train logging.
  grad_norm_sample: false
  grad_norm_max_samples: 2
